# Re-deploys the Supabase edge functions whenever their code changes.
# One-time: GitHub repo → Settings → Secrets and variables → Actions → New secret
#   SUPABASE_ACCESS_TOKEN = a personal access token from https://supabase.com/dashboard/account/tokens
name: Deploy Supabase functions
on:
  push:
    branches: [main]
    paths: ['Solaris-AI-OS-GoLive/supabase/functions/**', '.github/workflows/supabase-functions.yml']
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: vvlxcxpqjakzglfbdiby
    defaults:
      run:
        working-directory: Solaris-AI-OS-GoLive
    steps:
      - uses: actions/checkout@v4
      - name: Check token
        id: tok
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo "::warning::SUPABASE_ACCESS_TOKEN secret not set — skipping function deploy"; echo "skip=1" >> "$GITHUB_OUTPUT"; fi
      - uses: supabase/setup-cli@v1
        if: steps.tok.outputs.skip != '1'
        with:
          version: latest
      - name: Deploy all functions (JWT check off — functions do their own auth)
        if: steps.tok.outputs.skip != '1'
        run: |
          for f in sarvam-webhook lead-context run-due new-lead start-call recording; do
            supabase functions deploy "$f" --project-ref "$PROJECT_REF" --no-verify-jwt --use-api
          done
