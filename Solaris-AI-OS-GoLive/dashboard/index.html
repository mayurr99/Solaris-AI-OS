<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<style>html,body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Solaris AI OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Devanagari:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#EEF1F4; --panel:#FFFFFF; --panel2:#F6F8FA; --ink:#13202B; --ink2:#34424F; --muted:#5E6B78; --line:#D9E0E7; --line2:#E7ECF0;
  --brand:#2447B8; --accent:var(--brand); --accent-ink:#FFFFFF; --accent-soft:color-mix(in srgb,var(--brand) 13%,#fff); --sun:#E89A0C; --sun-soft:#FFF3DC;
  --hot:#C9420B; --hot-soft:#FDE8DD; --warm:#A96A05; --warm-soft:#FBF0D6; --nurture:#1F7A76; --nurture-soft:#DDF1EF; --cold:#6B7785; --cold-soft:#E9EDF1; --dnc:#9B2C2C; --dnc-soft:#F6E1E1; --good:#157A3C; --good-soft:#DDF3E5; --bad:#B42318;
  --side:#0F1B26; --side-ink:#C9D4DE; --side-mute:#7F8E9C; --side-hi:#1B2B3A;
  --r:10px; --shadow:0 1px 2px rgba(16,32,48,.06),0 4px 14px rgba(16,32,48,.06);
  --f-body:"IBM Plex Sans","IBM Plex Sans Devanagari",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-dv:"IBM Plex Sans Devanagari","IBM Plex Sans","Noto Sans Devanagari",sans-serif;
  --f-disp:"Archivo","IBM Plex Sans",system-ui,sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){color-scheme:dark;
  --bg:#0A1118; --panel:#101A23; --panel2:#15212C; --ink:#E4EBF1; --ink2:#C3CED8; --muted:#8C9AA8; --line:#243341; --line2:#1B2833;
  --accent:color-mix(in srgb,var(--brand) 50%,#fff); --accent-ink:#0A1118; --accent-soft:color-mix(in srgb,var(--brand) 32%,#0A1118); --sun:#F4B43C; --sun-soft:#3A2C0E;
  --hot:#FF8A55; --hot-soft:#3D1D0E; --warm:#F0B64A; --warm-soft:#3A2B0C; --nurture:#5CC7C0; --nurture-soft:#0F302E; --cold:#9AA7B4; --cold-soft:#1E2A35; --dnc:#F28B8B; --dnc-soft:#3A1717; --good:#5BD08A; --good-soft:#0F2F1D; --bad:#FF7A6E;
  --side:#070D13; --side-hi:#152230; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);}}
:root[data-theme="dark"]{color-scheme:dark;
  --bg:#0A1118; --panel:#101A23; --panel2:#15212C; --ink:#E4EBF1; --ink2:#C3CED8; --muted:#8C9AA8; --line:#243341; --line2:#1B2833;
  --accent:color-mix(in srgb,var(--brand) 50%,#fff); --accent-ink:#0A1118; --accent-soft:color-mix(in srgb,var(--brand) 32%,#0A1118); --sun:#F4B43C; --sun-soft:#3A2C0E;
  --hot:#FF8A55; --hot-soft:#3D1D0E; --warm:#F0B64A; --warm-soft:#3A2B0C; --nurture:#5CC7C0; --nurture-soft:#0F302E; --cold:#9AA7B4; --cold-soft:#1E2A35; --dnc:#F28B8B; --dnc-soft:#3A1717; --good:#5BD08A; --good-soft:#0F2F1D; --bad:#FF7A6E;
  --side:#070D13; --side-hi:#152230; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.dv{font-family:var(--f-dv)}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.tnum{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-disp);font-stretch:88%;letter-spacing:-.01em;margin:0;text-wrap:balance}
h1{font-size:24px;font-weight:750} h2{font-size:17px;font-weight:700} h3{font-size:14px;font-weight:700}
.muted{color:var(--muted)} .small{font-size:12px} .xs{font-size:11px}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* shell */
#app{display:grid;grid-template-columns:228px 1fr;height:100%;}
#side{background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;padding:16px 10px;gap:4px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px}
.brand b{font-family:var(--f-disp);font-stretch:85%;font-size:18px;color:#fff;letter-spacing:-.01em}
.brand small{display:block;color:var(--side-mute);font-size:11px}
.nav{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--side-ink);cursor:pointer;border:0;background:none;width:100%;text-align:left;font-size:13.5px}
.nav:hover{background:var(--side-hi)} .nav.on{background:var(--side-hi);color:#fff;box-shadow:inset 3px 0 0 var(--sun)}
.nav svg{width:17px;height:17px;flex:none;opacity:.85}
.nav .cnt{margin-left:auto;font-family:var(--f-mono);font-size:11px;background:#233446;color:#dbe4ec;padding:1px 6px;border-radius:9px}
.nav .cnt.live{background:var(--hot);color:#fff}
.navsec{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--side-mute);padding:14px 10px 4px}
.side-foot{margin-top:auto;padding:12px 8px 0;font-size:11px;color:var(--side-mute);border-top:1px solid #1f2e3c}
#mainwrap{display:flex;flex-direction:column;min-width:0;height:100%}
#top{display:flex;align-items:center;gap:10px;padding:10px 20px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
#top .search{flex:1;min-width:160px;max-width:420px;position:relative}
#top .search input{width:100%;padding:8px 12px 8px 32px;border:1px solid var(--line);border-radius:8px;background:var(--panel2)}
#top .search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:15px;opacity:.5}
#main{flex:1;overflow-y:auto;padding:20px 20px 60px}
.page{max-width:1320px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.phead{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
.phead .grow{flex:1;min-width:200px}
.phead p{margin:4px 0 0;color:var(--muted);max-width:70ch}

/* primitives */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card>.hd{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line2);flex-wrap:wrap}
.card>.hd h2,.card>.hd h3{flex:1}
.card>.bd{padding:14px}
.grid{display:grid;gap:16px}.grid>*{min-width:0}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))} .g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-main{grid-template-columns:minmax(0,1.65fr) minmax(0,1fr)}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap} .row.nw{flex-wrap:nowrap} .sp{flex:1}
.stack{display:flex;flex-direction:column;gap:8px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-weight:500;font-size:13px;white-space:nowrap}
.btn:hover{border-color:var(--muted)} .btn svg{width:15px;height:15px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)} .btn.pri:hover{filter:brightness(1.08)}
.btn.sun{background:var(--sun);border-color:var(--sun);color:#1b1300}
.btn.ghost{border-color:transparent;background:transparent} .btn.ghost:hover{background:var(--panel2)}
.btn.danger{color:var(--bad)} .btn.sm{padding:4px 9px;font-size:12px} .btn:disabled{opacity:.5;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:600;letter-spacing:.03em;white-space:nowrap;border:1px solid transparent}
.pill.HOT{background:var(--hot-soft);color:var(--hot)} .pill.WARM{background:var(--warm-soft);color:var(--warm)} .pill.NURTURE{background:var(--nurture-soft);color:var(--nurture)} .pill.COLD{background:var(--cold-soft);color:var(--cold)} .pill.DNC{background:var(--dnc-soft);color:var(--dnc)}
.pill.good{background:var(--good-soft);color:var(--good)} .pill.bad{background:var(--dnc-soft);color:var(--dnc)} .pill.info{background:var(--accent-soft);color:var(--accent)} .pill.sun{background:var(--sun-soft);color:var(--warm)} .pill.mute{background:var(--cold-soft);color:var(--cold)}
.pill.line{border-color:var(--line);color:var(--ink2);background:transparent}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--muted)}
.dot.live{background:var(--hot);box-shadow:0 0 0 0 var(--hot);animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--hot) 60%,transparent)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
@media (prefers-reduced-motion:reduce){.dot.live{animation:none}.typing::after{animation:none}}
.chip{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:99px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-size:12.5px}
.chip.on{background:var(--ink);color:var(--panel);border-color:var(--ink)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:500}
input.i,select.i,textarea.i{padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);font-size:13.5px;width:100%;min-width:0}
textarea.i{resize:vertical;min-height:64px;line-height:1.5}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.tbl-wrap{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--panel)}
table.t td{padding:9px 10px;border-bottom:1px solid var(--line2);vertical-align:middle}
table.t tr.click{cursor:pointer} table.t tr.click:hover td{background:var(--panel2)}
.kpi{padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.kpi .v{font-family:var(--f-disp);font-stretch:85%;font-size:30px;font-weight:750;line-height:1.05;font-variant-numeric:tabular-nums}
.kpi .d{font-size:12px;color:var(--muted)}
.kpi .d b{color:var(--good);font-weight:600}
.empty{padding:28px;text-align:center;color:var(--muted)}
.bar{height:6px;background:var(--line2);border-radius:4px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:4px}
.score{font-family:var(--f-mono);font-weight:500;font-size:12.5px}
.av{width:28px;height:28px;border-radius:50%;display:inline-grid;place-items:center;font-size:11px;font-weight:600;background:var(--accent-soft);color:var(--accent);flex:none}
.av.ai{background:var(--sun-soft);color:var(--warm)}
.divider{height:1px;background:var(--line2);margin:4px 0}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{padding:8px 12px;border:0;background:none;cursor:pointer;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;white-space:nowrap}
.tab.on{color:var(--ink);border-bottom-color:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:10px 16px;border-radius:10px;font-size:13px;z-index:90;box-shadow:var(--shadow);max-width:calc(100% - 32px)}

/* transcript */
.tx{display:flex;flex-direction:column;gap:10px;overflow-y:auto;padding:14px}
.msg{display:flex;gap:8px;max-width:92%}
.msg .b{padding:8px 12px;border-radius:12px;font-family:var(--f-dv);font-size:14.5px;line-height:1.55;background:var(--panel2);border:1px solid var(--line2)}
.msg .who{font-size:10.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-bottom:2px;font-family:var(--f-body)}
.msg.ai .b{background:var(--sun-soft);border-color:transparent}
.msg.cust{align-self:flex-end;flex-direction:row-reverse} .msg.cust .b{background:var(--accent-soft);border-color:transparent}
.msg.sales .b{background:var(--good-soft);border-color:transparent}
.msg.sys{align-self:center;max-width:100%} .msg.sys .b{background:transparent;border:1px dashed var(--line);font-size:12px;color:var(--muted);font-family:var(--f-body)}
.msg.play .b{outline:2px solid var(--accent)}
.typing::after{content:"▍";animation:blink 1s steps(2) infinite;margin-left:2px;color:var(--muted)}
@keyframes blink{50%{opacity:0}}
.crmrow{display:grid;grid-template-columns:120px 1fr;gap:8px;padding:6px 0;border-bottom:1px solid var(--line2);font-size:13px;align-items:baseline}
.crmrow span:first-child{color:var(--muted);font-size:12px}
.crmrow.flash span:last-child{background:var(--sun-soft);border-radius:4px;transition:background 1.2s}
.wave{display:flex;align-items:center;gap:2px;height:22px}
.wave i{width:3px;background:var(--accent);border-radius:2px;height:30%;opacity:.7}
.wave.on i{animation:wv 1s ease-in-out infinite}
.wave.on i:nth-child(2n){animation-delay:.15s}.wave.on i:nth-child(3n){animation-delay:.3s}.wave.on i:nth-child(5n){animation-delay:.45s}
@keyframes wv{0%,100%{height:25%}50%{height:95%}}
@media (prefers-reduced-motion:reduce){.wave.on i{animation:none;height:60%}}

/* kanban */
.kan{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(230px,1fr);gap:12px;overflow-x:auto;padding-bottom:8px}
.col{background:var(--panel2);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;min-height:300px}
.col .ch{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:6px}
.col .cb{padding:8px;display:flex;flex-direction:column;gap:8px;flex:1}
.col.over{outline:2px dashed var(--accent)}
.kc{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 10px;cursor:grab;display:flex;flex-direction:column;gap:5px;font-size:12.5px}
.kc:hover{border-color:var(--muted)}
.steps{display:flex;gap:3px}.steps i{flex:1;height:4px;border-radius:2px;background:var(--line)}.steps i.d{background:var(--good)}

/* calendar */
.cal{display:grid;grid-template-columns:56px repeat(7,minmax(110px,1fr));min-width:880px;position:relative}
.cal .hh{font-size:11px;color:var(--muted);text-align:right;padding-right:6px;height:48px;border-top:1px solid var(--line2);font-family:var(--f-mono)}
.cal .dh{padding:8px;font-size:12px;font-weight:600;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:2}
.cal .dh.today{color:var(--accent)}
.cal .dc{position:relative;border-left:1px solid var(--line2)}
.cal .slot{height:48px;border-top:1px solid var(--line2)}
.ev{position:absolute;left:3px;right:3px;border-radius:6px;padding:4px 6px;font-size:11px;line-height:1.3;overflow:hidden;cursor:pointer;border-left:3px solid var(--accent);background:var(--accent-soft);color:var(--ink)}
.ev.Society{border-left-color:var(--nurture);background:var(--nurture-soft)} .ev.Factory{border-left-color:var(--hot);background:var(--hot-soft)}
.ev.Completed{opacity:.6} .ev.No-show{border-left-color:var(--dnc);background:var(--dnc-soft);text-decoration:line-through}

/* drawer & modal */
.scrim{position:fixed;inset:0;background:rgba(8,14,20,.45);z-index:50}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(620px,100%);background:var(--bg);z-index:51;display:flex;flex-direction:column;box-shadow:-10px 0 40px rgba(0,0,0,.2);padding-top:env(safe-area-inset-top,0px)}
.drawer .dhd{padding:16px 18px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}
.drawer .dbd{flex:1;overflow-y:auto;padding:16px 18px 40px;display:flex;flex-direction:column;gap:14px}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,calc(100% - 32px));max-height:calc(100% - 48px);overflow-y:auto;background:var(--panel);border-radius:12px;z-index:61;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal .mhd{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center}
.modal .mbd{padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.modal .mft{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.scrim.m{z-index:60}
.tl{display:flex;flex-direction:column}
.tl .it{display:grid;grid-template-columns:22px 1fr;gap:8px;padding:7px 0;font-size:13px}
.tl .ic{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--panel2);border:1px solid var(--line)}
.tl .ic svg{width:12px;height:12px}
.drop{border:2px dashed var(--line);border-radius:12px;padding:28px;text-align:center;background:var(--panel2);cursor:pointer}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.hbar{display:flex;align-items:center;gap:8px;font-size:12.5px}
.hbar .lbl{width:150px;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar .track{flex:1;height:14px;background:var(--line2);border-radius:3px;overflow:hidden}
.hbar .track i{display:block;height:100%;background:var(--accent)}
.hbar .val{min-width:44px;text-align:right;font-family:var(--f-mono);font-size:12px;white-space:nowrap}
.notice{padding:10px 12px;border-radius:8px;background:var(--sun-soft);font-size:12.5px;color:var(--ink2);border:1px solid color-mix(in srgb,var(--sun) 40%,transparent)}
.notice.info{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 30%,transparent)}
.switch{position:relative;width:34px;height:20px;flex:none}
.switch input{opacity:0;width:0;height:0}
.switch span{position:absolute;inset:0;background:var(--line);border-radius:20px;cursor:pointer;transition:.2s}
.switch span::before{content:"";position:absolute;width:14px;height:14px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
.switch input:checked+span{background:var(--good)} .switch input:checked+span::before{transform:translateX(14px)}
.qitem{display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:start;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
.agentcard{padding:16px;display:flex;flex-direction:column;gap:10px;cursor:pointer}
.agentcard:hover{border-color:var(--accent)}
.langs{display:flex;gap:4px}.langs span{font-size:11px;padding:1px 6px;border-radius:4px;background:var(--panel2);border:1px solid var(--line);font-weight:600}
.langs span.p{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.livecard .tx{height:340px}
.split{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:0}
.split>div+div{border-left:1px solid var(--line2)}
.guide h3{margin-top:4px}
.guide ol,.guide ul{margin:6px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:5px}
.day{display:grid;grid-template-columns:64px 1fr;gap:14px;padding:14px 0;border-top:1px solid var(--line2)}
.day .n{font-family:var(--f-disp);font-stretch:80%;font-size:30px;font-weight:800;color:var(--accent);line-height:1}

@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g-main{grid-template-columns:1fr}.g3{grid-template-columns:1fr 1fr}}
@media (max-width:760px){
  #app{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  #side{flex-direction:row;padding:8px;overflow-x:auto;gap:2px;align-items:center}
  #side .brand{padding:0 6px 0 2px}#side .brand div,.navsec,.side-foot{display:none}
  .nav{width:auto;padding:7px 9px}.nav span.lb{display:none}.nav .cnt{margin-left:2px}
  #main{padding:14px 16px 60px}#top{padding:8px 16px}
  .g2,.g3,.g4{grid-template-columns:1fr}.split{grid-template-columns:1fr}.split>div+div{border-left:0;border-top:1px solid var(--line2)}
  .hbar .lbl{width:100px}
}
</style>

</head>
